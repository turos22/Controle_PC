name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    name: Testes (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # o resultado de cada sistema importa, mesmo se outro falhar
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Bibliotecas gráficas do Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen

  pacote:
    name: Pacote (${{ matrix.os }})
    needs: testes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Bibliotecas gráficas do Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: python -m pip install ".[empacotar]"
      - run: python packaging/construir.py --saida build/pacote
      - uses: actions/upload-artifact@v4
        with:
          name: controle-por-gestos-${{ runner.os }}
          path: |
            build/pacote/*.zip
            build/pacote/*.dmg
            build/pacote/*.tar.gz
